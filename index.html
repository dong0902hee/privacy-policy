<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="dark light" />
  <title>Privacy Policy Hub</title>
  <style>
    :root{--bg:#0d0f12;--surface:#15181d;--text:#f4f6f8;--muted:#9aa3ad;--line:rgba(255,255,255,.08);--radius:22px}
    *{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at top left,rgba(255,255,255,.05),transparent 32rem),var(--bg);color:var(--text);font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Noto Sans KR","Segoe UI",sans-serif;line-height:1.7}
    main{width:min(860px,calc(100% - 40px));margin:0 auto;padding:72px 0 96px}h1{margin:0 0 14px;font-size:clamp(38px,7vw,64px);letter-spacing:-.045em;line-height:1.08}.intro{color:var(--muted);max-width:680px;margin:0 0 42px}.card{display:block;padding:24px;border:1px solid var(--line);border-radius:var(--radius);background:linear-gradient(145deg,rgba(255,255,255,.045),rgba(255,255,255,.015));color:inherit;text-decoration:none}.card:hover{background:linear-gradient(145deg,rgba(255,255,255,.07),rgba(255,255,255,.025))}.card strong{display:block;font-size:20px;margin-bottom:6px}.muted{color:var(--muted)}footer{margin-top:48px;padding-top:28px;border-top:1px solid var(--line);color:var(--muted);font-size:14px}@media(max-width:600px){main{width:min(100% - 28px,860px);padding-top:44px}}
  </style>
</head>
<body>
<main>
  <h1>Privacy Policy</h1>
  <p class="intro">Public privacy policies and legal notices for apps and digital products.</p>

  <a class="card" href="./framediary.html">
    <strong>FrameDiary</strong>
    <span class="muted">개인정보처리방침 · Privacy Policy</span>
  </a>

  <footer>© 2026 dong0902hee. All rights reserved.</footer>
</main>
</body>
</html>
